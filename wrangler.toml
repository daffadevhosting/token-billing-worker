name = "ai-token-billing"
main = "src/billing.ts"
compatibility_date = "2024-03-01"

# CORS configuration (optional override)
[vars]
CORS_ORIGIN = "*"

# Binding KV Namespace (Ganti id dibawah ini dengan id KV Anda sendiri)
[[kv_namespaces]]
binding = "TOKEN_BALANCES"
id = "YOUR_KV_NAMESPACE_ID_HERE"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"